<!doctype html>
<html lang="pt-BR">
  <head>
    <script type="text/javascript">
      (function() {
        var q = window.location.search;
        if (q.indexOf('?p=') === 0) {
          window.history.replaceState(null, null,
            window.location.pathname.slice(0, -1) + q.slice(3).replace(/&q=/, '?')
          );
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRIMEP - Instituto Religioso das Medianeiras da Paz</title>
  </head>
  <body class="bg-[#fcfbf9] text-gray-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
